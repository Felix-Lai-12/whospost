<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Whospost 留言線索</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
<!-- Felix 10-26: status; a three-cell dashboard; what is left this hour (meters after Claude's usage page); checking an
     account. The list folds away; the chip thresholds and the API address have no UI (Felix 10-26). No mode choice, no switches, no trust or blocked lists. -->
<header class="row head">
 <span class="light" id="light" aria-hidden="true"></span>
 <div class="grow"><strong>Whospost 留言線索</strong><div class="muted small" id="status">讀取中</div></div>
 <label class="switch"><input type="checkbox" id="enabled"><span>開啟</span></label>
</header>

<div class="dash" id="dashboard" role="group" aria-label="累計">
 <div class="cell"><span class="num" id="d-queried">0</span><span class="label">已查詢</span></div>
 <div class="cell"><span class="num" id="d-analyzed">0</span><span class="label">已分析</span></div>
 <div class="cell"><span class="num" id="d-blocked">0</span><span class="label">已封鎖</span></div>
</div>

<section aria-labelledby="usageHeading">
 <h2 id="usageHeading">這小時還能用</h2>
 <div class="meter" id="liveMeter">
  <div class="row"><span class="grow">即時查</span><span class="meter-right" id="liveRight"></span></div>
  <div class="bar" role="progressbar" aria-label="即時查已用" aria-valuemin="0" id="liveBar"><span></span></div>
  <p class="muted small" id="liveLine"></p>
 </div>
 <div class="meter" id="profileMeter">
  <div class="row"><span class="grow">帳號背景</span><span class="meter-right" id="profileRight"></span></div>
  <div class="bar" role="progressbar" aria-label="帳號背景已用" aria-valuemin="0" id="profileBar"><span></span></div>
  <p class="muted small" id="profileLine"></p>
 </div>
</section>

<section>
 <form id="check" class="row">
  <input type="text" id="username" class="grow" placeholder="查一個帳號：@帳號" aria-label="查一個帳號" autocomplete="off" spellcheck="false">
  <button type="submit" class="btn">到 Whospost 查</button>
 </form>
 <p class="muted small" id="checkNote">會開新分頁並預填帳號，查詢要你自己按。</p>
</section>

<details class="advanced">
 <summary>進階設定</summary>
 <h3>清單</h3>
 <div class="row"><span class="muted grow" id="list">尚未下載</span><button type="button" id="refresh" class="btn">立即更新</button></div>
</details>

<footer class="muted small">
 <p>Whospost 不判定誰是網軍；每項線索都附原文。被動瀏覽時不送任何帳號資訊。</p>
 <p><a id="site" href="https://whospost.felixlai.workers.dev/?from=ext" target="_blank" rel="noopener">Whospost 網站</a> · <a href="https://whospost.felixlai.workers.dev/privacy" target="_blank" rel="noopener">隱私</a></p>
</footer>
<script type="module" src="popup.js"></script>
</body>
</html>
