<!doctype html>
<!--
 Threads profile page for the 封鎖助手 e2e (EXTENSION-SPEC §4.5). Hand-written, not captured: the structure the extension
 relies on, as measured 2026-10-24 in a logged-in Chrome (English UI) on https://www.threads.com/@zuck:
  - the profile header row: an Instagram link, a bell button, and the "⋯" — div[role="button"][aria-haspopup="dialog"]
    holding an <svg> whose <title> is "More"; the only such button outside div[data-pressable-container] (the top bar's
    two "More" buttons say aria-haspopup="menu"; each post's ⋯ sits inside its pressable container)
  - pressing it adds a [role="menu"] whose [role="menuitem"]s come in three groups, one parent each:
    Copy link · About this profile · Add to feed / Mute · Restrict / Block · Report (Block and Report in red)
  - Block opens a [role="dialog"]: "Block zuck?", one paragraph, then two div[role="button"]s, Block and Cancel
    (Block first in the DOM, drawn on the right); pressing Block closes the dialog.
 Served by run.mjs at https://www.threads.com/@<user> with __USER__ replaced. data-variant="no-block" (user04) leaves
 the Block group out of the menu, the "layout changed" case: the run must stop after the ⋯ and press nothing else.
 window.__presses records what was pressed, for the assertions.
-->
<html lang="en" data-variant="__VARIANT__">
<head><meta charset="utf-8"><title>__USER__ • Threads</title>
<style>
 body{margin:0;font:15px/1.4 -apple-system,system-ui,sans-serif;background:#fff;color:#000}
 .top{display:flex;justify-content:space-between;padding:16px 24px}
 .col{max-width:600px;margin:0 auto;border:1px solid #ddd;border-radius:24px;padding:24px}
 .row{display:flex;align-items:center;gap:12px;margin-top:16px}
 .grow{flex:1;color:#999}
 [role=button]{display:inline-flex;align-items:center;justify-content:center;min-width:36px;height:36px;border-radius:10px;cursor:pointer}
 .follow{display:block;margin-top:16px;padding:8px;background:#000;color:#fff;text-align:center;border-radius:10px}
 [role=menu]{position:absolute;right:calc(50% - 300px);top:150px;width:240px;background:#fff;border:1px solid #ddd;border-radius:16px;box-shadow:0 8px 28px rgba(0,0,0,.15);padding:6px}
 [role=menu]>div{border-bottom:1px solid #eee;padding:4px 0}[role=menu]>div:last-child{border:0}
 [role=menuitem]{display:block;padding:10px 12px;cursor:pointer}
 .red{color:#ff3040}
 .scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center}
 [role=dialog]{width:280px;background:#fff;border-radius:16px;text-align:center;padding:20px 0 0}
 [role=dialog] .btns{display:flex;flex-direction:row-reverse;border-top:1px solid #ddd;margin-top:16px}
 [role=dialog] .btns [role=button]{flex:1;height:48px;border-radius:0}
 .post{margin-top:24px;padding-top:16px;border-top:1px solid #eee}
</style></head>
<body>
<div class="top">
 <div role="button" aria-haspopup="menu" tabindex="0"><svg viewBox="0 0 24 24" width="18" height="18"><title>More</title><circle cx="12" cy="12" r="2"/></svg></div>
 <b>__USER__</b>
 <div role="button" aria-haspopup="menu" tabindex="0"><svg viewBox="0 0 24 24" width="18" height="18"><title>More</title><circle cx="12" cy="12" r="2"/></svg></div>
</div>
<div class="col">
 <h1>__USER__</h1><div>__USER__</div>
 <div class="row">
  <div class="grow">1,234 followers</div>
  <a href="https://www.instagram.com/__USER__/" role="link"><svg viewBox="0 0 24 24" width="24" height="24"><rect x="3" y="3" width="18" height="18" rx="5" fill="none" stroke="#000"/></svg></a>
  <div role="button" tabindex="0"><svg viewBox="0 0 24 24" width="24" height="24"><path d="M6 17h12l-2-3V9a4 4 0 0 0-8 0v5z" fill="none" stroke="#000"/></svg></div>
  <div role="button" aria-haspopup="dialog" tabindex="0" id="profile-more"><svg viewBox="0 0 24 24" width="24" height="24"><title>More</title><circle cx="6" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="18" cy="12" r="1.5"/></svg></div>
 </div>
 <div class="follow" role="button" tabindex="0" id="follow">Follow</div>
 <div class="post" data-pressable-container="true">
  <a href="/@__USER__">__USER__</a> · a post
  <div role="button" aria-haspopup="menu" tabindex="0"><svg viewBox="0 0 24 24" width="18" height="18"><title>More</title><circle cx="12" cy="12" r="2"/></svg></div>
 </div>
</div>
<script>
(()=>{
 const user='__USER__',variant=document.documentElement.dataset.variant;
 const presses=window.__presses=[];
 const h=(tag,attrs,...kids)=>{const n=document.createElement(tag);for(const [k,v] of Object.entries(attrs||{}))n.setAttribute(k,v);n.append(...kids);return n;};
 const item=(text,red)=>h('div',{role:'menuitem',tabindex:'0',class:red?'red':''},h('span',{},text));
 let menu=null;
 document.getElementById('profile-more').addEventListener('click',()=>{
  presses.push('more');
  if(menu){menu.remove();menu=null;return;}
  const groups=[h('div',{},item('Copy link'),item('About this profile'),item('Add to feed')),h('div',{},item('Mute'),item('Restrict'))];
  if(variant!=='no-block')groups.push(h('div',{},item(document.getElementById('follow').textContent==='Unblock'?'Unblock':'Block',true),item('Report',true)));
  // Like Threads, the menu shows up a moment after the press.
  setTimeout(()=>{menu=h('div',{role:'menu'},...groups);document.body.append(menu);
   menu.addEventListener('click',e=>{const it=e.target.closest('[role=menuitem]');if(!it)return;presses.push(`menu:${it.textContent}`);menu.remove();menu=null;if(it.textContent==='Block')setTimeout(confirmDialog,200);});},150);
 });
 function confirmDialog(){
  const block=h('div',{role:'button',tabindex:'0'},h('b',{},'Block')),cancel=h('div',{role:'button',tabindex:'0'},'Cancel');
  const scrim=h('div',{class:'scrim'},h('div',{role:'dialog'},h('b',{},`Block ${user}?`),h('p',{},`${user} won't be able to find your profile or content.`),h('div',{class:'btns'},block,cancel)));
  document.body.append(scrim);
  block.addEventListener('click',()=>{presses.push('confirm:Block');setTimeout(()=>{scrim.remove();document.getElementById('follow').textContent='Unblock';},300);});
  cancel.addEventListener('click',()=>{presses.push('confirm:Cancel');scrim.remove();});
 }
})();
</script>
</body>
</html>
